{{define "head"}}
<link rel="stylesheet" href="/web/static/css/chat.css?v=chat-14">
<script src="/web/static/js/chat.js?v=chat-15" defer></script>
{{end}}

{{define "content"}}

<section class="chat-page" data-current-user="{{.Username}}" data-time-format="{{.ChatSettings.TimeFormat}}" data-message-density="{{.ChatSettings.MessageDensity}}" data-show-timestamps="{{.ChatSettings.ShowTimestamps}}" data-show-image-previews="{{.ChatSettings.ShowImagePreviews}}">
    <header class="chat-header">
        <div>
            <h1 id="chat-title">Chat</h1>
            <p id="chat-description">Global room for logged-in Jaylub users. Messages update automatically.</p>
        </div>
        <div class="chat-status" aria-label="Online users" tabindex="0" aria-describedby="online-users-tooltip">
            <span class="chat-status-dot" aria-hidden="true"></span>
            <span id="online-count">0</span>
            <span>online</span>
            <div id="online-users-tooltip" class="online-users-tooltip" role="tooltip">
                <span class="online-users-empty">No users online</span>
            </div>
        </div>
    </header>

    <nav class="chat-channel-tabs" aria-label="Chat channels">
        <button type="button" class="chat-channel-button is-active" data-chat-channel="global" aria-pressed="true">Global chat</button>
        <button type="button" class="chat-channel-button" data-chat-channel="self" aria-pressed="false">Notes to self</button>
    </nav>

    <div id="chat-error" class="chat-error" role="alert" hidden></div>
    <div id="chat-connection" class="chat-connection" role="status" hidden></div>

    <section id="message-list" class="message-list" aria-live="polite" aria-label="Chat messages">
        <p class="chat-empty">Loading messages…</p>
    </section>
    <button id="new-messages" class="new-messages" type="button" hidden>New messages</button>

    <form id="chat-form" class="chat-form" autocomplete="off">
        <div class="chat-input-area">
            <textarea id="message-input" name="message" maxlength="500" rows="2" placeholder="Message" aria-label="Message"></textarea>
            <span id="message-counter" class="message-counter" aria-live="polite">0 / 500</span>
        </div>
        <input id="file-input" name="file" type="file" hidden>
        <div class="chat-compose">
            <div class="chat-actions">
                <button id="file-button" class="file-button" type="button" aria-label="Attach a file" title="Attach a file">+</button>
                <button id="open-gift-dialog" class="gift-open-button" type="button">Gift</button>
                <button type="submit">Send</button>
            </div>
            <span id="file-name" class="file-name" aria-live="polite"></span>
        </div>
    </form>

    <dialog id="coin-gift-dialog" class="coin-gift-dialog">
        <form id="coin-gift-form" class="coin-gift-form">
            <h2>Gift Jaylive coins</h2>
            <label>
                Gift type
                <select id="gift-type" name="type">
                    <option value="direct">Send to a user</option>
                    <option value="card">Post a claimable gift card</option>
                </select>
            </label>
            <label id="gift-recipient-field">
                Recipient
                <select id="gift-recipient" name="recipientId" required></select>
            </label>
            <label>
                Amount
                <input id="gift-amount" name="amount" type="number" min="1" max="1000000" step="1" required>
            </label>
            <p class="gift-dialog-note">Gift amounts are deducted from your Jaylive coin balance.</p>
            <div class="gift-dialog-actions">
                <button type="button" id="cancel-gift">Cancel</button>
                <button type="submit">Send gift</button>
            </div>
        </form>
    </dialog>
</section>

{{end}}
